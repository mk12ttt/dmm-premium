<!DOCTYPE html>
<html lang="ja">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: #111;
      color: #fff;
    }

    /* ヒーロー */
    .hero {
      background: linear-gradient(160deg, #1c1400 0%, #2e2000 50%, #1c1400 100%);
      text-align: center;
      padding: 48px 20px 40px;
      border-bottom: 3px solid #c9a227;
    }

    .hero-label {
      display: inline-block;
      border: 1.5px solid #c9a227;
      color: #c9a227;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 4px 16px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: 1.9rem;
      font-weight: 900;
      line-height: 1.35;
      margin-bottom: 14px;
    }

    .hero h1 em {
      color: #c9a227;
      font-style: normal;
    }

    .hero p {
      font-size: 0.9rem;
      color: #bbb;
      line-height: 1.8;
      max-width: 480px;
      margin: 0 auto 28px;
    }

    .btn-main {
      display: inline-block;
      background: #c9a227;
      color: #000;
      font-size: 1rem;
      font-weight: 900;
      padding: 15px 44px;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 4px 24px rgba(201,162,39,0.45);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn-main:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 30px rgba(201,162,39,0.6);
    }

    /* バナー一覧 */
    .banners {
      max-width: 640px;
      margin: 0 auto;
      padding: 32px 16px 48px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-label {
      text-align: center;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #c9a227;
      margin-bottom: 4px;
    }

    .section-title {
      text-align: center;
      font-size: 1.2rem;
      font-weight: 900;
      margin-bottom: 24px;
    }

    .banner-link {
      display: block;
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
    }

    .banner-link:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 24px rgba(0,0,0,0.6);
    }

    .banner-link img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 下部CTA */
    .cta-bottom {
      background: linear-gradient(160deg, #1c1400, #2e2000);
      text-align: center;
      padding: 44px 20px;
      border-top: 3px solid #c9a227;
    }

    .cta-bottom p {
      font-size: 0.85rem;
      color: #999;
      margin-top: 14px;
    }

    footer {
      text-align: center;
      padding: 16px;
      font-size: 0.72rem;
      color: #555;
    }

    footer a { color: #777; }
  </style>
